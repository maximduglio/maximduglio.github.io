<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAXIM DUGLIO - Pottery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sidebar">
        <div class="logo">MAXIM DUGLIO</div>
        <nav class="nav">
            <a href="index.html">DRAWINGS</a>
            <a href="photos.html">PHOTOS</a>
            <a href="pottery.html" class="active">POTTERY</a>
            <a href="mailto:maxim.duglio@gmail.com">CONTACT</a>
        </nav>
    </div>
    
    <div class="gallery" id="gallery"></div>
    
    <script>
        const folder = 'pottery';
        const gallery = document.getElementById('gallery');

        // Image list with intrinsic dimensions, so the browser can reserve
        // space before each file arrives (no layout shift).
        const images = [
            [1200, 1600], [1200, 1600], [1200, 1600], [1200, 1600],
            [1200, 1600], [1200, 1600], [1200, 1600], [1200, 1600],
            [1200, 1600], [1600, 1200], [1200, 1600], [810, 1080],
            [1600, 1200], [1600, 1200]
        ];

        // Calculate column count based on viewport width
        function getColumnCount() {
            return window.innerWidth <= 768 ? 2 : 4;
        }

        // Load and display gallery
        function loadGallery() {
            const columnCount = getColumnCount();

            // Create columns, tracking each one's height as a multiple of its
            // width so mixed portrait/landscape images still pack evenly
            const columns = [];
            const columnHeights = [];
            for (let i = 0; i < columnCount; i++) {
                const column = document.createElement('div');
                column.className = 'column';
                gallery.appendChild(column);
                columns.push(column);
                columnHeights.push(0);
            }

            // Distribute images across columns
            images.forEach(([width, height], index) => {
                const img = document.createElement('img');
                img.src = `media/${folder}/${index + 1}.jpg`;
                img.alt = 'Portfolio image';
                img.width = width;
                img.height = height;
                img.decoding = 'async';

                // First row is above the fold: fetch it immediately, lazy-load the rest
                if (index < columnCount) {
                    img.fetchPriority = 'high';
                } else {
                    img.loading = 'lazy';
                }

                // Always append to whichever column is currently shortest
                const columnIndex = columnHeights.indexOf(Math.min(...columnHeights));
                columnHeights[columnIndex] += height / width;
                columns[columnIndex].appendChild(img);
            });
        }
        
        // Reload gallery on window resize
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                const newColumnCount = getColumnCount();
                if ((window.innerWidth <= 768 && gallery.children.length !== 2) ||
                    (window.innerWidth > 768 && gallery.children.length !== 4)) {
                    gallery.innerHTML = '';
                    loadGallery();
                }
            }, 250);
        });
        
        // Initial load
        loadGallery();
    </script>
</body>
</html>
