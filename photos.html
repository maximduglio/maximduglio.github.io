<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAXIM DUGLIO - Photos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sidebar">
        <div class="logo">MAXIM DUGLIO</div>
        <nav class="nav">
            <a href="index.html">DRAWINGS</a>
            <a href="photos.html" class="active">PHOTOS</a>
            <a href="pottery.html">POTTERY</a>
            <a href="mailto:maxim.duglio@gmail.com">CONTACT</a>
        </nav>
    </div>
    
    <div class="gallery" id="gallery"></div>
    
    <script>
        const folder = 'photos';
        const gallery = document.getElementById('gallery');

        // Image list with intrinsic dimensions, so the browser can reserve
        // space before each file arrives (no layout shift).
        const images = [
            // Existing numbered photos
            [1034, 1600], [908, 1130], [1600, 1056], [1565, 1037],
            [1035, 1600], [1490, 818], [1402, 976], [1600, 1071],
            [1600, 1071], [1600, 1060], [1600, 1060],
            // Named photos
            [1200, 1600], [1200, 1600], [1600, 1200], [1200, 1600],
            [1200, 1600], [1600, 1200], [1200, 1600], [1600, 1200],
            [1200, 1600], [1200, 1600], [1200, 1600], [1600, 1200],
            [1200, 1600], [1200, 1600], [1600, 1200], [1200, 1600],
            [1200, 1600], [1600, 1200], [1200, 1600], [1200, 1600]
        ];

        // Image filenames
        const imageFilenames = [
            // Existing numbered photos
            '1.jpg', '2.jpg', '3.jpg', '4.jpg',
            '5.jpg', '6.jpg', '7.jpg', '8.jpg',
            '9.jpg', '10.jpg', '11.jpg',
            // Named photos
            'building.jpg', 'decon.jpg', 'denamrk.jpg', 'escaltor.jpg',
            'finger.JPG', 'grass.jpg', 'guy.jpg', 'henry.jpg',
            'house.jpg', 'merchent.jpg', 'monarch.jpg', 'nailssprread.jpg',
            'poster.jpg', 'rope.jpg', 'salvation.jpg', 'shado.JPG',
            'shell.jpeg', 'sky.jpg', 'spred.jpg', 'sulpture.jpg',
            'wood.jpg', 'zian.jpg'
        ];

        // Calculate column count based on viewport width
        function getColumnCount() {
            return window.innerWidth <= 768 ? 2 : 4;
        }

        // Load and display gallery
        function loadGallery() {
            const columnCount = getColumnCount();

            // Create columns, tracking each one's height as a multiple of its
            // width so mixed portrait/landscape images still pack evenly
            const columns = [];
            const columnHeights = [];
            for (let i = 0; i < columnCount; i++) {
                const column = document.createElement('div');
                column.className = 'column';
                gallery.appendChild(column);
                columns.push(column);
                columnHeights.push(0);
            }

            // Distribute images across columns
            images.forEach(([width, height], index) => {
                const img = document.createElement('img');
                img.src = `media/${folder}/${imageFilenames[index]}`;
                img.alt = 'Portfolio image';
                img.width = width;
                img.height = height;
                img.decoding = 'async';

                // First row is above the fold: fetch it immediately, lazy-load the rest
                if (index < columnCount) {
                    img.fetchPriority = 'high';
                } else {
                    img.loading = 'lazy';
                }

                // Always append to whichever column is currently shortest
                const columnIndex = columnHeights.indexOf(Math.min(...columnHeights));
                columnHeights[columnIndex] += height / width;
                columns[columnIndex].appendChild(img);
            });
        }
        
        // Reload gallery on window resize
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                const newColumnCount = getColumnCount();
                if ((window.innerWidth <= 768 && gallery.children.length !== 2) ||
                    (window.innerWidth > 768 && gallery.children.length !== 4)) {
                    gallery.innerHTML = '';
                    loadGallery();
                }
            }, 250);
        });
        
        // Initial load
        loadGallery();
    </script>
</body>
</html>
